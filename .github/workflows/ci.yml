name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 與發佈建置相同的 Xcode 27；macos-26 的 Xcode 26.6 無法編譯本專案
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Show toolchain
        run: xcodebuild -version
      - name: Install tools
        run: brew install xcodegen shellcheck actionlint
      # 與本機相同的檢查：lint、typecheck、完整測試
      - name: Check
        run: ./scripts/check.sh
      # 失敗時保留 xcresult，可在 Xcode 開啟查看失敗的測試與 log
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: build/check/Tests.xcresult
          if-no-files-found: ignore

  # 以發行用的 make-dmg.sh 打包並核對 dmg，提早發現只在 Release／universal 建置才出現的問題。
  # 產物未簽章，不上傳；正式簽章只在本機執行（ADR-0017）。
  release-build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install tools
        run: brew install xcodegen uv
      - name: Package dmg
        run: ./scripts/make-dmg.sh
      - name: Verify dmg
        run: ./scripts/verify-dmg.sh dist/Ripen-*.dmg
