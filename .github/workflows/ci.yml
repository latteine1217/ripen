name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Show toolchain
        run: xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test
        run: >
          xcodebuild test
          -project Ripen.xcodeproj
          -scheme Ripen
          -destination 'platform=macOS'
          -resultBundlePath build/ci/Tests.xcresult
      # 失敗時保留 xcresult，可在 Xcode 開啟查看失敗的測試與 log
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: build/ci/Tests.xcresult
